<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potenzfunktionen mit negativen Exponenten</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e2e5ea;
  --grid:#eceff3; --axis:#374151; --accent:#2563eb; --accent-soft:#e0eaff;
  --ok:#15803d; --ok-soft:#dcfce7; --lock:#9ca3af; --warn-soft:#fff7e0; --warn:#92600a;
  --bad:#b91c1c; --bad-soft:#fde8e8; --ref:#8b95a5;
}
@media (prefers-color-scheme: dark){
  body:not(.lk){
    --bg:#111827; --panel:#1c2433; --text:#f3f4f6; --muted:#9ca3af; --line:#334155;
    --grid:#253044; --axis:#d1d5db; --accent:#60a5fa; --accent-soft:#1e3a5f;
    --ok:#4ade80; --ok-soft:#153d25; --lock:#6b7280; --warn-soft:#3a2f12; --warn:#f5c65b;
    --bad:#f87171; --bad-soft:#3b1a1a; --ref:#8b95a5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.hidden{display:none !important}
.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.frac>span{padding:0 .1em}
sup{font-size:.62em}

/* ---------- Kopf ---------- */
header.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0 auto 0 0;user-select:none;-webkit-user-select:none}
.badge{background:var(--accent-soft);color:var(--text);border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px;font-size:.9rem}
.kurz{display:none}

/* ---------- Karten, Knöpfe ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:1.02rem;margin:0 0 8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-size:1rem;cursor:pointer;min-height:44px}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.input{font:inherit;font-size:1.3rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:100;max-width:92vw;font-size:.98rem;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}

/* ---------- Bildschirme (Anmeldung, Sperre …) ---------- */
.screen{max-width:640px;margin:0 auto;padding:18px 14px 40px}
.screen h2{font-size:1.25rem;margin:6px 0 12px}
.screen p{margin:0 0 12px}
.big-msg{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.big-msg .icon{font-size:3.4rem}
.big-msg h2{font-size:1.5rem;margin:0}
.big-msg p{font-size:1.1rem;max-width:30em;margin:0}
.big-msg .dots{width:min(320px,80vw)}
.grid-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grid-g button{min-height:64px;font-size:1.15rem;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.grid-g button small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.sp-list{display:flex;flex-direction:column;gap:10px}
.sp-btn{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.sp-btn .nr{flex:0 0 44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.sp-btn b{display:block;font-size:1.05rem}
.sp-btn span.q{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.sp-btn:disabled{cursor:not-allowed;opacity:.55}
.sp-btn:disabled .nr{background:var(--lock)}
.sp-btn .tag{display:inline-block;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--bad)}

/* ---------- Arbeitsansicht (Lernende) ---------- */
.work{display:grid;gap:12px;padding:12px;grid-template-columns:1fr;grid-template-areas:"auftrag" "graph" "regler" "tabelle" "hilfen"}
.work .auftrag{grid-area:auftrag}
.work .graphbox{grid-area:graph}
.work .regler{grid-area:regler}
.work .tabelle{grid-area:tabelle}
.work .hilfen{grid-area:hilfen}
@media (max-width:899px){
  header.top h1 .lang{display:none}
  header.top h1 .kurz{display:inline}
  .work .graphbox{position:sticky;top:var(--hh,52px);z-index:5;height:42vh;min-height:230px;box-shadow:0 6px 12px -8px rgba(0,0,0,.25)}
}
@media (min-width:900px){
  .work{grid-template-columns:1fr 400px;grid-template-areas:"graph auftrag" "graph regler" "graph tabelle" "graph hilfen";align-items:start}
  .work .graphbox{position:sticky;top:64px;height:calc(100vh - 80px)}
}
.graphbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;height:min(56vh,480px);min-height:260px}
.graphbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.legend{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:60%}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:.88rem;display:flex;align-items:center;gap:6px;opacity:.95}
.sw{width:18px;height:4px;border-radius:2px;display:inline-block;flex:0 0 18px}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:1.5rem;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoom button.small{font-size:.8rem;font-weight:600}
.ghint{position:absolute;bottom:6px;left:10px;right:60px;font-size:.78rem;color:var(--muted);pointer-events:none}

.auftrag .q{font-size:1.18rem;font-weight:700;margin:2px 0 10px}
.auftrag .nrbig{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-weight:800;margin-right:6px;font-size:1rem;vertical-align:1px}
.auftrag ul{margin:0;padding-left:1.2em}
.auftrag li{margin:3px 0}
.auftrag .tipp{margin-top:8px;color:var(--muted);font-size:.95rem}
.auftrag .note{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:.95rem}
.du-box{border-radius:12px;padding:12px;margin-bottom:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.du-box.me{background:var(--ok-soft);border-color:var(--ok)}
.du-box h3{margin:0 0 6px;font-size:1.05rem}
.du-box p{margin:0 0 8px}
.dots{display:flex;gap:6px;margin:4px 0 8px}
.dots span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots span.done{background:var(--ok)}
.dots span.cur{background:var(--accent)}

.term{font-size:1.9rem;text-align:center;padding:2px 0 6px}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.slider .val{font-size:1.15rem}
.slider .ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:-6px}
input[type=range]{width:100%;height:40px;accent-color:var(--accent)}
table.wt{border-collapse:collapse;width:100%;font-size:.95rem}
table.wt td,table.wt th{border:1px solid var(--line);padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.wt th{background:var(--bg);font-weight:600;text-align:center}
table.wt td.x{text-align:center;background:var(--bg);font-weight:600}
table.wt td.sep{border:0;width:8px;padding:0;background:transparent}
table.wt td.g{color:var(--muted)}
table.wt td.leer{border:0;background:transparent}
.wt-wrap{overflow-x:auto}
.acc{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
.acc>button{width:100%;text-align:left;background:var(--bg);border:0;padding:11px 12px;font-size:1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;min-height:44px}
.acc>button:disabled{color:var(--lock);cursor:not-allowed}
.acc.open>button{background:var(--accent-soft)}
.acc .txt{padding:10px 12px;display:none}
.acc.open .txt{display:block}
.acc ul{margin:0;padding-left:1.1em}
.acc li{margin:4px 0}
.acc dl{margin:0}
.acc dt{font-weight:700;margin-top:6px}
.acc dd{margin:0 0 2px 0;color:var(--muted)}

/* ---------- Lehrkraft (Tablet über HDMI am Smartboard) ---------- */
body.lk{font-size:20px;background:#f3f4f6}
.lk header.top{padding:8px 16px;gap:8px}
.lk header.top h1{font-size:1.05rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-size:1rem;cursor:pointer;min-height:46px;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button.pause.on{background:var(--bad);border-color:var(--bad)}
.timer{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;min-width:3.2em;text-align:center}
.timer.end .t{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.timer button{border:0;background:none;font-size:1.2rem;cursor:pointer;padding:6px;min-width:40px;min-height:40px}
.lk-main{padding:16px;display:grid;gap:16px}
.cols2{display:grid;gap:16px;grid-template-columns:minmax(280px,380px) 1fr;align-items:start}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.perm{width:100%;border-collapse:collapse;font-size:1.25rem}
.perm td{padding:2px 6px}
.perm td.l{text-align:right;white-space:nowrap}
.perm td.eq{text-align:center;width:1em}
.perm td.r{text-align:left;white-space:nowrap}
.perm-bsp{font-size:1.35rem;margin-top:10px;line-height:2.2}
.qrbox{text-align:center}
.qrbox svg{width:min(240px,100%);height:auto;background:#fff;border-radius:12px}
.qrbox .url{font-size:.95rem;color:var(--muted);word-break:break-all}
.qrbox .code{font-size:1.8rem;font-weight:800;letter-spacing:.15em}
.ablauf{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.ablauf span{padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:1rem}
.ablauf span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.gcard h3{margin:0 0 8px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.slots{display:flex;gap:6px}
.slot{flex:1;height:52px;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:var(--lock);position:relative;background:none;cursor:default}
.slot.full{border:2px solid var(--accent);background:var(--accent-soft);color:var(--text);cursor:pointer}
.slot.full.off{border-color:var(--lock);background:var(--bg)}
.slot .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.slot.off .dot{background:var(--lock)}
.slot.cur{outline:3px solid var(--ok);outline-offset:1px}
.ductl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.95rem}
.ductl button{min-width:40px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.bespr{display:grid;gap:16px;grid-template-columns:1fr 470px;align-items:stretch;height:calc(100vh - 100px)}
.bespr .graphbox{height:100%}
@media (max-width:1100px){.bespr{grid-template-columns:1fr;height:auto}.bespr .graphbox{height:60vh}}
.bespr-side{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.row.sel{border:3px solid var(--accent);padding:8px 10px}
.row .nr{flex:0 0 40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:1.05rem}
.row select{font:inherit;font-size:.95rem;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin-top:4px}
.dice{flex:0 0 auto;min-width:96px;min-height:64px;border-radius:12px;border:2px solid var(--accent);background:var(--panel);cursor:pointer;font-size:1.05rem;font-weight:800;line-height:1.1}
.dice .dn{display:block;font-size:1.7rem}
.dice.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.toolbar .term{font-size:1.6rem;padding:0}
.toolbar input[type=range]{width:200px}
.res-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.res-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.3rem;display:flex;justify-content:space-between;align-items:center}
.res-item .math{font-size:2rem}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog .card{max-width:520px;width:100%}
.stepper{display:flex;align-items:center;gap:12px;font-size:1.2rem}
.stepper button{min-width:48px;min-height:48px;font-size:1.4rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js" onerror="window.__ohneServer=true"></script>
<script src="/lib/qrcode.js" onerror="window.__ohneQR=true"></script>
<script>
(function () {
'use strict';

/* ================================================================== */
/* Inhalte                                                             */
/* f(x) = x^n mit n = −1, −2, …, −9 (wie f(x) = x^n aus der Vorstunde)  */
/* ================================================================== */

var N_MIN = -9, N_MAX = -1, N_START = -2;
var RECHNUNG = 'Erkläre deine Beobachtung rechnerisch, z. B. mit <span class="math">x<sup>−2</sup> = <span class="frac"><span>1</span><span>x<sup>2</sup></span></span></span>.';
var SP = {
  1: {
    kurz: 'Nahe 0',
    frage: 'Was passiert mit dem Graphen, wenn x ganz nah an 0 kommt? Was passiert bei x = 0?',
    zusatz: RECHNUNG,
    tipp: 'Tipp: Mit + kannst du nah an x = 0 heranzoomen.',
    hilfen: [
      'Schau in die Wertetabelle: Was passiert mit f(x), wenn x von 1 über 0,5 bis 0,1 immer näher an 0 kommt? Und links von 0, also bei −1, −0,5 und −0,1?',
      'Rechne selbst: <span class="math">0,1<sup>−2</sup> = 1/0,1² = 1/0,01 = ?</span> Und was wäre <span class="math">0<sup>−2</sup> = 1/0²</span>? Kann man durch 0 teilen?'
    ],
    bausteine: ['Je näher x an 0 kommt, desto … wird …', 'Bei x = 0 …', 'Der Graph nähert sich der … an.']
  },
  2: {
    kurz: 'Sehr große x',
    frage: 'Was passiert mit dem Graphen, wenn x sehr groß wird – positiv und negativ?',
    zusatz: RECHNUNG,
    tipp: 'Tipp: Mit − kannst du herauszoomen, um sehr große x zu sehen.',
    hilfen: [
      '„Sehr groß – positiv und negativ“ heißt: x = 10 oder x = 100, aber auch x = −10 oder x = −100. Schau in die Wertetabelle. Zoome heraus und tippe auf den Graphen bei x = 100 und x = −100. Was passiert mit f(x)?',
      'Rechne selbst: <span class="math">100<sup>−2</sup> = 1/100² = ?</span> Wird f(x) irgendwann genau 0? Zoome nah an die x-Achse heran: Berührt der Graph sie?'
    ],
    bausteine: ['Je größer |x| wird, desto näher kommt f(x) der Zahl …', 'f(x) wird aber nie …', 'Der Graph nähert sich der … an.']
  },
  3: {
    kurz: 'Die beiden Teile',
    frage: 'Wie liegen die beiden Teile des Graphen zueinander?',
    zusatz: 'Begründe deine Beobachtung mit der Wertetabelle.',
    tipp: null,
    hilfen: [
      'Vergleiche in der Tabelle f(2) mit f(−2) und f(0,5) mit f(−0,5). Was fällt dir auf? Probiere gerade und ungerade n aus.',
      'Erinnere dich an die Potenzfunktionen mit positiven Exponenten: Klappe den Graphen in Gedanken an der y-Achse um. Oder drehe ihn einmal halb um den Ursprung (0 | 0). Was passt bei welchem n?'
    ],
    bausteine: ['Der Graph ist achsensymmetrisch zur …', 'Der Graph ist punktsymmetrisch zum …', 'In der Tabelle sieht man: f(−2) = … und f(2) = …, also …']
  },
  4: {
    kurz: 'Wo verläuft der Graph?',
    frage: 'Wo im Koordinatensystem verläuft der Graph? Gibt es Punkte, durch die mehrere Graphen gehen?',
    zusatz: 'Begründe deine Beobachtung mit der Wertetabelle.',
    tipp: 'Tipp: Mit „Graph festhalten“ siehst du mehrere Graphen gleichzeitig.',
    hilfen: [
      'Halte mehrere Graphen fest, z. B. für n = −1, −2, −3 und −4. Wo liegen sie: oberhalb oder unterhalb der x-Achse? Links oder rechts der y-Achse?',
      'Schau in der Tabelle auf x = 1 und x = −1. Welche Funktionswerte haben die Graphen dort? Rechne: <span class="math">1<sup>−3</sup> = 1/1³ = ?</span> und <span class="math">(−1)<sup>−3</sup> = 1/(−1)³ = ?</span>'
    ],
    bausteine: ['Für gerades n sind alle Funktionswerte …', 'Für ungerades n sind die Funktionswerte links von 0 … und rechts von 0 …', 'Alle Graphen gehen durch den Punkt (… | …).']
  },
  5: {
    kurz: 'Vergleich mit positiven Exponenten',
    frage: 'Was ist anders als bei Potenzfunktionen mit positiven Exponenten? Was bleibt gleich?',
    zusatz: null,
    tipp: 'Tipp: Schalte „Vergleich: positiver Exponent“ ein.',
    hilfen: [
      'Mit „Vergleich“ siehst du grau den Graphen mit positivem Exponenten, z. B. bei n = −2 den Graphen von <span class="math">g(x) = x<sup>2</sup></span>. Vergleiche die beiden Graphen. Probiere dann n = −3.',
      'Achte auf: Wie viele Teile hat der Graph? Gibt es den Punkt (0 | 0)? Ist der Graph symmetrisch? Welche Punkte gibt es bei x = 1 und x = −1?'
    ],
    bausteine: ['Gleich bleibt: …', 'Anders ist: …', 'Bei positiven Exponenten …, bei negativen Exponenten dagegen …']
  }
};
var BAUSTEIN_N = 'Bei geradem n …, bei ungeradem n …';
var WOERTER = [
  ['Exponent', 'die hochgestellte Zahl: Bei x⁻³ ist der Exponent n = −3.'],
  ['gerade / ungerade Zahl', 'gerade: …, −4, −2, 2, 4, … · ungerade: …, −3, −1, 1, 3, …'],
  ['Funktionswert f(x)', 'der y-Wert, der zu einem x-Wert gehört'],
  ['Betrag |x|', 'Abstand einer Zahl von 0, ohne Vorzeichen: |−100| = 100 und |100| = 100'],
  ['positiv / negativ', 'größer als 0 / kleiner als 0'],
  ['Ursprung', 'der Punkt (0 | 0)'],
  ['nicht definiert', 'Für diesen x-Wert gibt es keinen Funktionswert.'],

    var h = $('header.top'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px');
  }
  window.addEventListener('resize', kopfhoehe);
  function arbeitZeigen(an) {
    $('#work').classList.toggle('hidden', !an);
    $('#screen').classList.toggle('hidden', an);
    kopfhoehe();
    if (an) { plot.layout(); plot.draw(); }
  }
  function screen(html) { arbeitZeigen(false); $('#screen').innerHTML = html; }
  function kopf() {
    var b = $('#badge'), a = $('#aendern');
    if (modus === 'frei') {
      b.textContent = 'Frei erkunden'; b.classList.remove('hidden'); a.classList.add('hidden'); return;
    }
    if (ansicht && ansicht.ich) {
      b.textContent = 'Gruppe ' + ansicht.ich.gruppe + ' · Nr. ' + ansicht.ich.sp;
      b.classList.remove('hidden');
      a.classList.toggle('hidden', ansicht.phase !== 'ich' || ansicht.pause);
    } else { b.classList.add('hidden'); a.classList.add('hidden'); }
  }
  $('#aendern').addEventListener('click', function () {
    if (!socket || !confirm('Gruppe oder Nummer ändern? Deine Nummer wird dann wieder frei.')) return;
    socket.emit('s:abmelden', {}, function (r) {
      if (r && !r.ok) return toast(r.fehler, true);
      meineId = null; speichern(null); gewaehlteGruppe = null;
    });
  });

  /* ----- freier Modus (ohne Server, z. B. zu Hause oder als Notlösung) ----- */
  function freiStarten() {
    modus = 'frei';
    if (socket) { socket.disconnect(); socket = null; }
    clearTimeout(verbindeT); clearTimeout(retryT);
    kopf();
    freiZeichnen();
  }
  function freiZeichnen() {
    var h = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
    for (var k = 1; k <= 5; k++) h += '<button class="btn' + (k === freiSp ? ' on' : '') + '" data-f="' + k + '">Nr. ' + k + '</button>';
    h += '</div>' + auftragHTML(freiSp, true);
    $('#auftrag').innerHTML = h;
    $$('#auftrag [data-f]').forEach(function (b) { b.addEventListener('click', function () { freiSp = +b.getAttribute('data-f'); freiZeichnen(); }); });
    hilfenZeigen(freiSp);
    arbeitZeigen(true);
  }

  /* ----- Verbindung ----- */
  function speicherKey() { return 'pfn_' + code; }
  function speichern(wahl) {
    if (!wahl) speicher.del(speicherKey());
    else speicher.setJSON(speicherKey(), { id: meineId, gruppe: wahl.gruppe, sp: wahl.sp });
  }
  function beitreten() {
    var gespeichert = speicher.getJSON(speicherKey(), null);
    socket.emit('s:beitreten', { code: code, id: gespeichert && gespeichert.id, wahl: gespeichert }, function (r) {
      clearTimeout(verbindeT);
      if (!r || !r.ok) {
        modus = 'unbekannt';
        screen('<div class="big-msg"><div class="icon">⏳</div><h2>Warte auf die Lehrkraft</h2><p>Die Stunde mit dem Code <b>' + esc(code) + '</b> ist gerade nicht erreichbar. Die Seite versucht es automatisch weiter.</p><button class="btn" id="frei1">Ohne Anmeldung erkunden</button></div>');
        $('#frei1').addEventListener('click', freiStarten);
        clearTimeout(retryT);
        retryT = setTimeout(function () { if (socket && modus === 'unbekannt') beitreten(); }, 5000);
        return;
      }
      if (gespeichert && r.ansicht.ich) meineId = gespeichert.id;
      else if (gespeichert && !r.ansicht.ich) { speichern(null); meineId = null; }
      ansichtSetzen(r.ansicht);
    });
  }
  function verbinden() {
    modus = 'verbinde';
    screen('<div class="big-msg"><div class="icon">📡</div><h2>Verbinde …</h2><p>Einen Moment bitte.</p><div id="langsam"></div></div>');
    verbindeT = setTimeout(function () {
      var l = $('#langsam');
      if (l) l.innerHTML = '<p>Das dauert ungewöhnlich lange. Wenn es nicht klappt, kannst du ohne Anmeldung arbeiten und dir eine Nummer aussuchen.</p><button class="btn" id="frei2">Ohne Anmeldung erkunden</button>';
      var b = $('#frei2'); if (b) b.addEventListener('click', freiStarten);
    }, 10000);
    socket = window.io({ transports: ['websocket', 'polling'] });
    socket.on('connect', beitreten);
    socket.on('s:ansicht', ansichtSetzen);
    socket.on('s:beendet', function () {
      ende = true; speichern(null);
      screen('<div class="big-msg"><div class="icon">✅</div><h2>Die Stunde ist beendet</h2><p>Danke fürs Mitmachen! Du kannst das Tool weiter frei nutzen.</p><button class="btn primary" id="frei3">Frei weiter erkunden</button></div>');
      $('#frei3').addEventListener('click', freiStarten);
      kopf();
      socket.disconnect();
    });
  }

  /* ----- Anzeige je nach Phase ----- */
  function ansichtSetzen(v) {
    if (modus === 'frei' || ende) return;
    ansicht = v;
    if (!v.ich && meineId) { meineId = null; speichern(null); }
    kopf();
    if (!v.ich) { modus = 'wahl'; return wahlZeigen(); }
    modus = 'dabei';
    nachOben(v.phase + (v.pause ? 'p' : '') + (v.phase === 'du' ? v.du.schritt : ''));
    if (v.pause) {
      return screen('<div class="big-msg"><div class="icon">✋</div><h2>Bitte schaut nach vorn</h2><p>Gleich geht es weiter.</p></div>');
    }
    var ph = v.phase, ich = v.ich;
    if (ph === 'besprechung') {
      return screen('<div class="big-msg"><div class="icon">🗣️</div><h2>Besprechung</h2><p>Schaut nach vorn. Ergänzt oder verbessert eure Übersicht in eigenen Worten.</p></div>');
    }
    if (ph === 'reserve') {
      var r = v.reserve;
      return screen('<div class="big-msg"><div class="icon">✏️</div><h2>Eure Funktion</h2><p class="math" style="font-size:2.4rem">' + (r ? 'f(x) = x<sup>−' + r + '</sup>' : '–') + '</p><p>Skizziert den Graphen in der Mitte eures Placemats. Beschriftet ihn mit den Eigenschaften aus eurer Übersicht.</p></div>');
    }
    if (ph === 'du') return duZeigen(v);
    // Ich-Phase
    $('#auftrag').innerHTML = auftragHTML(ich.sp, true);
    hilfenZeigen(ich.sp);
    arbeitZeigen(true);
  }

  function duZeigen(v) {
    var ich = v.ich, k = v.du.schritt;
    if (k > 5) {
      return screen('<div class="big-msg"><div class="icon">✅</div><h2>Alle Zeilen sind vorgestellt</h2>' + punkte(6) +
        '<p>Prüft gemeinsam: Steht in jeder Zeile eurer Übersicht etwas? Einigt euch auf Formulierungen, die jede und jeder von euch vorstellen kann.</p></div>');
    }
    if (ich.sp !== k && v.du.experte) {
      // Zuhören: das Tool ist gesperrt
      return screen('<div class="big-msg"><div class="icon">👂</div><h2>Nr. ' + k + ' erklärt</h2>' + punkte(k) +
        '<p><b>' + esc(SP[k].frage) + '</b></p>' +
        '<p>Hör zu und trage Zeile ' + k + ' in deine Übersicht ein. Frag nach, wenn du etwas nicht verstehst.</p></div>');
    }
    var weiter = k < 5 ? 'weiter zu Nr. ' + (k + 1) : 'Runde beenden', h;
    if (ich.sp === k) {
      h = '<div class="du-box me"><h3>Du bist dran: Nr. ' + k + '</h3>' + punkte(k) +
        '<p>Zeige deiner Gruppe deinen Graphen und erkläre, was du herausgefunden hast. Die anderen tragen es in Zeile ' + k + ' ihrer Übersicht ein.</p>' +
        '<button class="btn ok" id="weiter">Fertig erklärt – ' + weiter + '</button></div>' + auftragHTML(k, false);
      hilfenZeigen(null);
    } else {
      h = '<div class="du-box"><h3>Nr. ' + k + ': gemeinsam untersuchen</h3>' + punkte(k) +
        '<p>Diese Nummer hat in eurer Gruppe niemand untersucht. Untersucht sie jetzt gemeinsam und tragt Zeile ' + k + ' in eure Übersicht ein.</p>' +
        '<button class="btn" id="weiter">Fertig – ' + weiter + '</button></div>' + auftragHTML(k, true, true);
      hilfenZeigen(k);
    }
    $('#auftrag').innerHTML = h;
    $('#weiter').addEventListener('click', function () {
      this.disabled = true;
      socket.emit('s:weiter', { von: k }, function () {});
    });
    arbeitZeigen(true);
  }

  function wahlZeigen() {
    var v = ansicht;
    if (v.phase !== 'ich') {
      screen('<div class="big-msg"><div class="icon">🔒</div><h2>Die Anmeldung ist geschlossen</h2><p>Melde dich bei deiner Lehrkraft.</p></div>');
      return;
    }
    if (!gewaehlteGruppe || gewaehlteGruppe > v.gruppen) {
      var h = '<div class="screen"><h2>1. Wähle deine Gruppe</h2><div class="grid-g">';
      for (var gi = 1; gi <= v.gruppen; gi++) {
        var anz = (v.vergeben[gi] || []).length;
        h += '<button data-g="' + gi + '">Gruppe ' + gi + '<small>' + anz + ' angemeldet</small></button>';
      }
      h += '</div></div>';
      screen(h);
      $$('[data-g]').forEach(function (b) { b.addEventListener('click', function () { gewaehlteGruppe = +b.getAttribute('data-g'); wahlZeigen(); }); });
      return;
    }
    var belegt = v.vergeben[gewaehlteGruppe] || [];
    var erst4 = [1, 2, 3, 4].every(function (k) { return belegt.indexOf(k) >= 0; });
    var h2 = '<div class="screen"><p><button class="linkbtn" id="zurueck">← andere Gruppe</button></p>' +
      '<h2>2. Gruppe ' + gewaehlteGruppe + ': Wähle eine Nummer</h2><p>Jede Nummer gibt es in eurer Gruppe nur einmal. Sprecht euch ab.</p><div class="sp-list">';
    for (var k = 1; k <= 5; k++) {
      var weg = belegt.indexOf(k) >= 0, gesperrt = k === 5 && !erst4 && !weg;
      h2 += '<button class="sp-btn" data-sp="' + k + '"' + (weg || gesperrt ? ' disabled' : '') + '><span class="nr">' + k + '</span><span><b>' + esc(SP[k].kurz) + '</b><span class="q">' + esc(SP[k].frage) + '</span>' +
        (weg ? '<span class="tag">schon vergeben</span>' : gesperrt ? '<span class="tag">nur in Fünfergruppen – erst wenn 1 bis 4 vergeben sind</span>' : '') + '</span></button>';
    }
    h2 += '</div></div>';
    screen(h2);
    $('#zurueck').addEventListener('click', function () { gewaehlteGruppe = null; wahlZeigen(); });
    $$('[data-sp]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sp = +b.getAttribute('data-sp');
        $$('[data-sp]').forEach(function (x) { x.disabled = true; });
        socket.emit('s:waehlen', { gruppe: gewaehlteGruppe, sp: sp }, function (r) {
          if (!r || !r.ok) { toast((r && r.fehler) || 'Das hat nicht geklappt.', true); wahlZeigen(); return; }
          meineId = r.id;
          speichern({ gruppe: gewaehlteGruppe, sp: sp });
        });
      });
    });
  }

  /* ----- Start ----- */
  if (frei) return freiStarten();
  if (!code) {
    screen('<div class="screen"><h2>Code eingeben</h2><p>Scanne den QR-Code oder gib den Code ein.</p>' +
      '<input class="input" id="codein" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="z. B. K7QF" style="text-transform:uppercase;letter-spacing:.2em">' +
      '<div class="btns"><button class="btn primary" id="go">Weiter</button><button class="btn" id="frei4">Ohne Anmeldung erkunden</button></div></div>');
    $('#go').addEventListener('click', function () {
      var c = $('#codein').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length !== 4) return toast('Der Code hat 4 Zeichen.', true);
      location.search = '?c=' + c;
    });
    $('#codein').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#go').click(); });
    $('#frei4').addEventListener('click', freiStarten);
    return;
  }
  verbinden();
}

/* ================================================================== */
/* Lehrkraft (Tablet, über HDMI am Smartboard)                         */
/* ================================================================== */

function lehrkraftApp() {
  document.body.classList.add('lk');
  var app = $('#app');
  if (window.__ohneServer || typeof window.io !== 'function') {
    app.innerHTML = '<div class="big-msg"><h2>Kein Server</h2><p>Die Lehrkraft-Ansicht funktioniert nur, wenn das Tool über den Server (Render) geöffnet wird.</p></div>';
    return;
  }
  var socket = window.io({ transports: ['websocket', 'polling'] });
  var cfg = { passwortNoetig: false };
  var sitzung = speicher.getJSON('pfn_lk', null);   // { code, token }
  var z = null;                                       // Zustand vom Server
  var gebaut = null;                                  // Phase, für die der Inhalt gebaut wurde
  var plot = null, zeile = 1, alteWuerfe = {};
  var timer = { rest: 0, laeuft: false, t: null, phase: null };

  fetch('/config.json').then(function (r) { return r.json(); }).then(function (c) { cfg = c; if (!z) start(); }).catch(function () {});

  function aktion(d, cb) {
    d.code = sitzung.code; d.token = sitzung.token;
    socket.emit('lk:aktion', d, function (r) {
      if (r && !r.ok && r.fehler) toast(r.fehler, true);
      if (cb) cb(r);
    });
  }
  function sichern() {
    if (!z || !sitzung) return;
    speicher.setJSON('pfn_lk_snap', {
      code: sitzung.code, token: sitzung.token, gruppen: z.gruppen, phase: z.phase,
      lernende: z.lernende.map(function (l) { return { id: l.id, gruppe: l.gruppe, sp: l.sp }; }),
      duSchritt: z.duSchritt, zeilen: z.zeilen, gewuerfelt: z.gewuerfelt, ohneExperte: z.ohneExperte, reserve: z.reserve
    });
  }
  function zustandSetzen(neu) { z = neu; sichern(); zeichnen(); }

  socket.on('connect', function () { if (sitzung) beitreten(); else start(); });
  socket.on('lk:zustand', zustandSetzen);
  socket.on('lk:beendet', function () { speicher.del('pfn_lk'); speicher.del('pfn_lk_snap'); sitzung = null; z = null; start(); });

  function beitreten() {
    socket.emit('lk:beitreten', sitzung, function (r) {
      if (r && r.ok) return zustandSetzen(r.zustand);
      var snap = speicher.getJSON('pfn_lk_snap', null);
      if (r && r.grund === 'unbekannt' && snap && snap.code === sitzung.code) {
        socket.emit('lk:wiederherstellen', { passwort: speicher.get('pfn_pw') || '', snapshot: snap }, function (r2) {
          if (r2 && r2.ok) { toast('Die Stunde wurde nach einem Server-Neustart wiederhergestellt.'); return zustandSetzen(r2.zustand); }
          if (r2 && r2.fehler === 'passwort') return pwAbfrage(snap);
          sitzung = null; speicher.del('pfn_lk'); start();
        });
        return;
      }
      sitzung = null; speicher.del('pfn_lk'); start();
    });
  }
  function pwAbfrage(snap) {
    app.innerHTML = '<div class="screen"><div class="card"><h2>Stunde wiederherstellen</h2><p>Der Server wurde neu gestartet. Gib dein Passwort ein, um die Stunde (Code ' + esc(snap.code) + ') wiederherzustellen. Die Geräte der Lernenden verbinden sich danach automatisch neu.</p>' +
      '<input class="input" type="password" id="pw2" placeholder="Passwort"><div class="btns"><button class="btn primary" id="wh">Wiederherstellen</button><button class="btn" id="neu2">Neue Stunde</button></div></div></div>';
    $('#wh').addEventListener('click', function () { speicher.set('pfn_pw', $('#pw2').value); beitreten(); });
    $('#neu2').addEventListener('click', function () { sitzung = null; speicher.del('pfn_lk'); speicher.del('pfn_lk_snap'); start(); });
  }

  function start() {
    if (sitzung) return;
    gebaut = null; plot = null;
    app.innerHTML = '<div class="screen" style="max-width:560px"><div class="card"><h2>Neue Stunde anlegen</h2>' +
      '<p>Potenzfunktionen mit negativen Exponenten – Placemat</p>' +
      '<div class="stepper" style="margin:12px 0"><span>Anzahl der Gruppen:</span><button id="gm">−</button><b id="gz">5</b><button id="gp">+</button></div>' +
      (cfg.passwortNoetig ? '<label>Passwort<input class="input" type="password" id="pw" value="' + esc(speicher.get('pfn_pw') || '') + '"></label>' : '') +
      '<div class="btns"><button class="btn primary" id="anlegen">Stunde anlegen</button></div>' +
      '<p style="font-size:.9rem;color:var(--muted);margin-top:14px">Tipp: Lege die Stunde vor dem Unterricht an. Der kostenlose Server bei Render braucht nach einer Pause bis zu einer Minute zum Aufwachen.</p></div></div>';
    var gz = 5;
    $('#gm').addEventListener('click', function () { gz = Math.max(1, gz - 1); $('#gz').textContent = gz; });
    $('#gp').addEventListener('click', function () { gz = Math.min(8, gz + 1); $('#gz').textContent = gz; });
    $('#anlegen').addEventListener('click', function () {
      var pw = cfg.passwortNoetig ? $('#pw').value : '';
      socket.emit('lk:anlegen', { gruppen: gz, passwort: pw }, function (r) {
        if (!r || !r.ok) return toast((r && r.fehler) || 'Das hat nicht geklappt.', true);
        if (cfg.passwortNoetig) speicher.set('pfn_pw', pw);
        sitzung = { code: r.code, token: r.token };
        speicher.setJSON('pfn_lk', sitzung);
        zustandSetzen(r.zustand);
      });
    });
  }

  /* ----- Timer ----- */
  function timerSetzen(phase) {
    var p = PHASEN.filter(function (x) { return x.id === phase; })[0];
    clearInterval(timer.t); timer.laeuft = false; timer.rest = (p ? p.min : 5) * 60; timer.phase = phase;
    timerZeigen();
  }
  function timerZeigen() {
    var el = $('#timer'); if (!el) return;
    var m = Math.floor(Math.max(0, timer.rest) / 60), s = Math.max(0, timer.rest) % 60;
    $('.t', el).textContent = m + ':' + (s < 10 ? '0' : '') + s;
    $('[data-tm="go"]', el).textContent = timer.laeuft ? '⏸' : '▶';
    el.classList.toggle('end', timer.rest <= 0);
  }
  function timerToggle() {
    if (timer.laeuft) { clearInterval(timer.t); timer.laeuft = false; }
    else {
      if (timer.rest <= 0) return;
      timer.laeuft = true;
      timer.t = setInterval(function () { timer.rest--; if (timer.rest <= 0) { clearInterval(timer.t); timer.laeuft = false; } timerZeigen(); }, 1000);
    }
    timerZeigen();
  }

  /* ----- Grundgerüst ----- */
  function geruest() {
    var tabs = PHASEN.map(function (p) { return '<button data-ph="' + p.id + '">' + p.name + '</button>'; }).join('');
    app.innerHTML = '<header class="top"><h1>Negative Exponenten</h1>' +
      '<div class="tabs">' + tabs + '<button class="pause" data-pause="1">✋ Geräte sperren</button></div>' +
      '<div class="timer" id="timer"><span class="t">0:00</span><button data-tm="go" aria-label="Start/Pause">▶</button><button data-tm="re" aria-label="Zurücksetzen">↺</button></div>' +
      '<span class="badge" id="codebadge"></span><button class="btn" id="menu" aria-label="Einstellungen">⚙</button></header>' +
      '<div class="lk-main" id="inhalt"></div>';
    $$('[data-ph]').forEach(function (b) { b.addEventListener('click', function () { aktion({ typ: 'phase', phase: b.getAttribute('data-ph') }); }); });
    $('[data-pause]').addEventListener('click', function () { aktion({ typ: 'pause', an: !z.pause }); });
    $('[data-tm="go"]').addEventListener('click', timerToggle);
    $('[data-tm="re"]').addEventListener('click', function () { timerSetzen(z.phase); });
    $('#menu').addEventListener('click', menue);
  }

  function menue() {
    var d = document.createElement('div');
    d.className = 'dialog';
    d.innerHTML = '<div class="card"><h2>Einstellungen</h2>' +
      '<div class="stepper" style="margin:10px 0"><span>Gruppen:</span><button data-m="gm">−</button><b>' + z.gruppen + '</b><button data-m="gp">+</button></div>' +
      '<div class="btns" style="flex-direction:column;align-items:stretch">' +
      '<button class="btn" data-m="voll">Vollbild an/aus</button>' +
      '<button class="btn" data-m="dureset">Vorstellungsrunde aller Gruppen auf Nr. 1 zurücksetzen</button>' +
      '<button class="btn" data-m="ende" style="color:var(--bad)">Stunde beenden (Daten löschen)</button>' +
      '<button class="btn primary" data-m="zu">Schließen</button></div></div>';
    document.body.appendChild(d);
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (e.target === d) return d.remove();
      if (!b) return;
      var m = b.getAttribute('data-m');
      if (m === 'gm' || m === 'gp') { aktion({ typ: 'gruppenzahl', n: z.gruppen + (m === 'gp' ? 1 : -1) }); d.remove(); }
      if (m === 'voll') { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); d.remove(); }
      if (m === 'dureset') { aktion({ typ: 'duAlleNeu' }); d.remove(); }
      if (m === 'ende') { if (confirm('Stunde beenden? Alle Anmeldungen werden gelöscht.')) aktion({ typ: 'beenden' }); d.remove(); }
      if (m === 'zu') d.remove();
    });
  }

  function zeichnen() {
    if (!z) return;
    if (!$('#inhalt')) { geruest(); gebaut = null; }
    $$('[data-ph]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-ph') === z.phase); });
    $('[data-pause]').classList.toggle('on', !!z.pause);
    $('[data-pause]').textContent = z.pause ? '✋ Geräte gesperrt' : '✋ Geräte sperren';
    $('#codebadge').textContent = 'Code ' + z.code;
    if (timer.phase !== z.phase) timerSetzen(z.phase);
    var art = (z.phase === 'ich' || z.phase === 'du') ? 'ichdu' : z.phase;
    if (gebaut !== art) { bauen(art); gebaut = art; }
    aktualisieren();
  }

  function qrHTML() {
    var url = location.origin + '/?c=' + z.code, svg = '';
    if (!window.__ohneQR && typeof window.qrcode === 'function') {
      var q = window.qrcode(0, 'M'); q.addData(url); q.make();
      svg = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    }
    return '<div class="qrbox">' + svg + '<div class="code">' + esc(z.code) + '</div><div class="url">' + esc(url) + '</div></div>';
  }
  function permHTML() {
    var zeilen = [
      ['2<sup>3</sup>', '8'], ['2<sup>2</sup>', '4'], ['2<sup>1</sup>', '2'], ['2<sup>0</sup>', '1'],
      ['2<sup>−1</sup>', '<span class="frac"><span>1</span><span>2</span></span> = <span class="frac"><span>1</span><span>2<sup>1</sup></span></span>'],
      ['2<sup>−2</sup>', '<span class="frac"><span>1</span><span>4</span></span> = <span class="frac"><span>1</span><span>2<sup>2</sup></span></span>'],
      ['2<sup>−3</sup>', '<span class="frac"><span>1</span><span>8</span></span> = <span class="frac"><span>1</span><span>2<sup>3</sup></span></span>']
    ];
    var h = '<table class="perm math">';
    zeilen.forEach(function (r) { h += '<tr><td class="l">' + r[0] + '</td><td class="eq">=</td><td class="r">' + r[1] + '</td></tr>'; });
    h += '</table><div class="perm-bsp math">' +
      'x<sup>−1</sup> = <span class="frac"><span>1</span><span>x</span></span>, &nbsp;' +
      'x<sup>−2</sup> = <span class="frac"><span>1</span><span>x<sup>2</sup></span></span>, &nbsp;' +
      'x<sup>−3</sup> = <span class="frac"><span>1</span><span>x<sup>3</sup></span></span>, …</div>';
    return h;
  }

  function bauen(art) {
    var el = $('#inhalt');
    plot = null;
    if (art === 'ichdu') {
      el.innerHTML = '<div class="cols2">' +
        '<div style="display:grid;gap:16px"><div class="card">' + qrHTML() + '</div>' +
        '<div class="card"><h2>Aus dem Einstieg</h2>' + permHTML() + '</div></div>' +
        '<div style="display:grid;gap:16px"><div class="card" id="auftragLK"></div><div class="gcards" id="gcards"></div></div></div>';
      return;
    }
    if (art === 'besprechung') {
      el.innerHTML = '<div class="bespr"><div style="display:flex;flex-direction:column;gap:10px;min-height:0">' +
        '<div class="toolbar"><span class="term math" id="bterm"></span><div style="min-width:220px">' + reglerHTML('bn') + '</div>' +
        '<button class="btn" id="bpin">Graph festhalten</button><button class="btn" id="bclear">Löschen</button><button class="btn" id="bvgl">Vergleich: positiver Exponent</button></div>' +
        graphHTML('bgbox').replace('class="graphbox"', 'class="graphbox" style="flex:1"') + '</div>' +
        '<div class="bespr-side" id="rows"></div></div>';
      plot = plotAnbinden($('#bgbox'), { font: 16 });
      var bt = function () {
        $('#bterm').innerHTML = termHTML(plot.n, true);
        $('.toolbar [data-nv]').textContent = 'n = ' + minus(plot.n);
        $('#bvgl').classList.toggle('on', plot.vergleich);
      };
      $('#bn').addEventListener('input', function () { plot.n = +this.value; plot.draw(); bt(); });
      $('#bpin').addEventListener('click', function () { plot.festhalten(); });
      $('#bclear').addEventListener('click', function () { plot.loeschen(); });
      $('#bvgl').addEventListener('click', function () { plot.vergleich = !plot.vergleich; plot.draw(); bt(); });
      plot.layout(); plot.draw(); bt();
      return;
    }
    if (art === 'reserve') {
      el.innerHTML = '<div class="card" style="font-size:1.4rem"><b>Skizziert den Graphen eurer Funktion in der Mitte eures Placemats.</b><br>Beschriftet ihn mit den Eigenschaften aus eurer Übersicht.</div>' +
        '<div class="res-list" id="reslist"></div>' +
        '<div class="btns"><button class="btn" id="resneu">Funktionen neu verteilen</button><button class="btn" id="ausblick">Ausblick zeigen</button></div>' +
        '<div class="card hidden" id="ausblicktext" style="font-size:1.6rem;text-align:center">Nächste Stunde: Was bewirkt der Faktor a in <span class="math">f(x) = a · x<sup>n</sup></span>?</div>';
      $('#resneu').addEventListener('click', function () { aktion({ typ: 'reserveVerteilen' }); });
      $('#ausblick').addEventListener('click', function () { $('#ausblicktext').classList.remove('hidden'); });
    }
  }

  function gruppenKarten() {
    var h = '';
    for (var gi = 1; gi <= z.gruppen; gi++) {
      var mit = z.lernende.filter(function (l) { return l.gruppe === gi; });
      var schritt = z.duSchritt[gi] || 1;
      h += '<div class="gcard"><h3><span>Gruppe ' + gi + '</span><span style="font-size:.9rem;color:var(--muted)">' + mit.length + ' Geräte</span></h3><div class="slots">';
      for (var k = 1; k <= 5; k++) {
        var l = mit.filter(function (x) { return x.sp === k; })[0];
        var cur = z.phase === 'du' && schritt === k;
        h += l ? '<button class="slot full' + (l.online ? '' : ' off') + (cur ? ' cur' : '') + '" data-weg="' + l.id + '" data-info="' + gi + '/' + k + '" title="Nr. ' + k + (l.online ? '' : ' (gerade nicht verbunden)') + '">' + k + '<span class="dot"></span></button>'
          : '<span class="slot' + (cur ? ' cur' : '') + '">' + k + '</span>';
      }
      h += '</div>';
      if (z.phase === 'du') {
        h += '<div class="ductl"><button data-du="' + gi + '" data-d="-1">−</button><span style="flex:1;text-align:center">' + (schritt > 5 ? '✓ fertig' : 'Nr. ' + schritt + ' stellt vor') + '</span><button data-du="' + gi + '" data-d="1">+</button></div>';
      }
      h += '</div>';
    }
    $('#gcards').innerHTML = h;
    $$('#gcards [data-weg]').forEach(function (b) {
      b.addEventListener('click', function () {
        var info = b.getAttribute('data-info').split('/');
        if (confirm('Gerät mit Nr. ' + info[1] + ' aus Gruppe ' + info[0] + ' entfernen? Die Nummer wird wieder frei.')) aktion({ typ: 'entfernen', id: b.getAttribute('data-weg') });
      });
    });
    $$('#gcards [data-du]').forEach(function (b) {
      b.addEventListener('click', function () {
        var gi = +b.getAttribute('data-du');
        var s = (z.duSchritt[gi] || 1) + (+b.getAttribute('data-d'));
        aktion({ typ: 'duSetzen', gruppe: gi, schritt: Math.max(1, Math.min(6, s)) });
      });
    });
  }

  function zeilenListe() {
    var h = '<label style="display:flex;gap:8px;align-items:center;font-size:.95rem"><input type="checkbox" id="ohneEx"' + (z.ohneExperte ? ' checked' : '') + ' style="width:22px;height:22px"> Würfeln ohne die Person, die die Nummer selbst untersucht hat</label>';
    for (var k = 1; k <= 5; k++) {
      var gr = z.zeilen[k], w = z.gewuerfelt[k];
      var opts = '';
      for (var gi = 1; gi <= z.gruppen; gi++) opts += '<option value="' + gi + '"' + (gi === gr ? ' selected' : '') + '>Gruppe ' + gi + '</option>';
      h += '<div class="row' + (k === zeile ? ' sel' : '') + '" data-zeile="' + k + '"><span class="nr">' + k + '</span><div class="mid"><b>' + esc(SP[k].kurz) + '</b>' +
        '<select data-zg="' + k + '">' + opts + '</select></div>' +
        '<button class="dice" data-w="' + k + '">' + (w ? '<span class="dn">Nr. ' + w + '</span>stellt vor' : '<span class="dn">🎲</span>würfeln') + '</button></div>';
    }
    h += '<div class="btns"><button class="btn" id="zneu">Zeilen neu zuteilen</button></div>';
    $('#rows').innerHTML = h;
    $('#ohneEx').addEventListener('change', function () { aktion({ typ: 'ohneExperte', an: this.checked }); });
    $('#zneu').addEventListener('click', function () { if (confirm('Zeilen neu auf die Gruppen verteilen? Gewürfelte Ergebnisse werden gelöscht.')) aktion({ typ: 'zeilenZuteilen' }); });
    $$('#rows [data-zeile]').forEach(function (r) {
      r.addEventListener('click', function (e) {
        if (e.target.closest('select,.dice')) return;
        zeile = +r.getAttribute('data-zeile');
        $$('#rows .row').forEach(function (x) { x.classList.toggle('sel', x === r); });
      });
    });
    $$('#rows [data-zg]').forEach(function (s) { s.addEventListener('change', function () { aktion({ typ: 'zeileGruppe', zeile: +s.getAttribute('data-zg'), gruppe: +s.value }); }); });
    $$('#rows [data-w]').forEach(function (b) { b.addEventListener('click', function () { aktion({ typ: 'wuerfeln', zeile: +b.getAttribute('data-w') }); }); });
    for (var kk = 1; kk <= 5; kk++) {
      if (z.gewuerfelt[kk] && alteWuerfe[kk] !== z.gewuerfelt[kk]) animieren(kk, z.gewuerfelt[kk]);
    }
    alteWuerfe = JSON.parse(JSON.stringify(z.gewuerfelt));
  }
  function animieren(k, ziel) {
    var b = $('#rows [data-w="' + k + '"]'); if (!b) return;
    var gr = z.zeilen[k], moegl = z.lernende.filter(function (l) { return l.gruppe === gr; }).map(function (l) { return l.sp; });
    if (moegl.length < 2) return;
    b.classList.add('rolling');
    var i = 0, t = setInterval(function () {
      b.innerHTML = '<span class="dn">Nr. ' + moegl[i++ % moegl.length] + '</span>…';
      if (i > 9) { clearInterval(t); b.classList.remove('rolling'); b.innerHTML = '<span class="dn">Nr. ' + ziel + '</span>stellt vor'; }
    }, 90);
  }

  function aktualisieren() {
    if (z.phase === 'ich' || z.phase === 'du') {
      var anz = z.lernende.length;
      $('#auftragLK').innerHTML = '<div class="ablauf"><span class="' + (z.phase === 'ich' ? 'on' : '') + '">Ich: allein</span><span class="' + (z.phase === 'du' ? 'on' : '') + '">Du: in der Gruppe</span><span>Besprechung</span></div>' +
        (z.phase === 'ich'
          ? '<p style="font-size:1.3rem;margin:8px 0 0"><b>1.</b> Scanne den QR-Code. Wähle deine Gruppe und eine Nummer. Jede Nummer gibt es pro Gruppe nur einmal.<br><b>2.</b> Arbeite allein und leise. Notiere in deinem Feld auf dem Placemat.</p>'
          : '<p style="font-size:1.3rem;margin:8px 0 0">Stellt euch reihum vor: Nr. 1 bis Nr. 5. Wer dran ist, zeigt und erklärt am eigenen Gerät.<br>Alle anderen hören zu und tragen die Zeile in ihre Übersicht ein.</p>') +
        '<p style="color:var(--muted);margin:8px 0 0;font-size:1rem">' + anz + ' Geräte angemeldet</p>';
      gruppenKarten();
    }
    if (z.phase === 'besprechung' && plot) zeilenListe();
    if (z.phase === 'reserve') {
      var h = '';
      for (var gi = 1; gi <= z.gruppen; gi++) h += '<div class="res-item"><span>Gruppe ' + gi + '</span><span class="math">f(x) = x<sup>−' + (z.reserve[gi] || '?') + '</sup></span></div>';
      $('#reslist').innerHTML = h;
    }
  }
}

/* ================================================================== */
if (location.pathname.replace(/\/+$/, '') === '/lehrkraft') lehrkraftApp();
else schuelerApp();
})();
</script>
